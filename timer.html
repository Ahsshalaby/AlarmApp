<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timer - Zen Mode</title>
  <!-- Include Google Fonts and Font Awesome -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Include the same styles as in index.html -->
  <style>
    /* Global Styles */
    #dark-mode {
      width: 67px;
      height: auto;
      cursor: pointer;
    }

    #dark-mode:hover {
      opacity: 0.8;
    }

    body {
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5dc;
    }

    .main {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .content {
      display: flex;
      flex: 1;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    .container, .container2 {
      flex: 1;
      max-width: 550px;
      background-color: #ffffff;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      min-height: 500px;
    }

    h1, h2 {
      text-align: center;
      color: #4b2e2e;
    }

    p {
      text-align: center;
      color: #333;
    }

    /* Timer Styles */
    #timerSettings {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }

    #timerSettings select,
    #timerSettings button {
      padding: 10px;
      margin-right: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }

    #timerSettings button {
      background-color: #4b2e2e;
      color: white;
      cursor: pointer;
    }

    #timerSettings button:hover {
      background-color: #333;
    }

    #timerMessage {
      margin-top: 15px;
      font-size: 18px;
      color: #333;
    }

    img#play_pause {
      margin-top: 20px;
      cursor: pointer;
      width: 150px;
      height: auto;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    #play_pause:hover {
      opacity: 0.8;
    }

    /* Dark Mode Styles */
    body.dark-mode {
      background-color: #121212;
    }

    .dark-mode .container, .dark-mode .container2 {
      background-color: #1e1e1e;
      color: #ffffff;
      border-color: #333;
    }

    .dark-mode button, .dark-mode input {
      background-color: #333;
      color: #ffffff;
    }

    .dark-mode button.addBtn:hover {
      background-color: black;
    }

    .dark-mode h1, .dark-mode h2 {
      color: #ffffff;
    }

    .dark-mode p {
      color: #eef2f5;
    }

    .dark-mode #timerSettings button {
      background-color: #333;
    }

    .dark-mode #timerSettings button:hover {
      background-color: black;
    }

    .dark-mode #timerMessage {
      color: #eef2f5;
    }

    /* Header Styles */
    .headerContainer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 100px;
      padding: 10px 100px;
      background-color: #fff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .appHeader {
      font-size: 2rem;
      color: #4b2e2e;
      font-weight: bold;
      margin: 0;
    }

    .dark-mode .headerContainer {
      background-color: #1e1e1e;
    }

    .dark-mode .appHeader {
      color: #eef2f5;
    }

    /* Footer Styles */
    footer {
      width: 100%;
      text-align: center;
      padding: 20px 0;
      margin-top: auto;
      transition: background-color 0.3s, color 0.3s;
    }

    body.light-mode footer {
      background-color: #f5f5f5;
      color: #333;
    }

    body.dark-mode footer {
      background-color: #121212;
      color: #eaeaea;
    }

    .footerContainer {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .socialIcons {
      display: flex;
      gap: 15px;
    }

    .socialIcons a {
      text-decoration: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s;
      background-color: #e0e0e0;
      color: #333;
    }

    .socialIcons a i {
      font-size: 1.5rem;
    }

    .footerNavigation ul {
      display: flex;
      gap: 20px;
      list-style: none;
      padding: 0;
    }

    .footerNavigation ul li a {
      text-decoration: none;
      font-size: 1rem;
      color: #4b2e2e;
      transition: color 0.3s;
    }

    .footerBottom {
      font-size: 0.9rem;
      text-align: center;
    }

    /* Breadcrumb */
    .breadcrumb {
      margin: 20px;
      font-size: 1rem;
    }

    .breadcrumb a {
      text-decoration: none;
      color: #4b2e2e;
    }

    .breadcrumb span {
      color: #333;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="headerContainer">
    <header class="appHeader">Productivity App</header>
    <img id="dark-mode" src="dark_mode.png" alt="Dark Mode Button" />
  </div>

  <!-- Dark Mode Toggle Script -->
  <script>
    const darkModeImage = document.getElementById('dark-mode');
    darkModeImage.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>

  <!-- Breadcrumb -->
  <div class="breadcrumb">
    <a href="index.html">Home</a> &gt; <span>Timer</span>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="content">
      <div class="container2">
        <h2>Timer - Zen Mode</h2>
        <p>Select timer length and click set timer when you are ready.</p>

        <div id="timerSettings">
          <select id="minutes">
            <option value="15">Minutes</option>
            <script>
              for (let i = 0; i <= 59; i++) {
                document.write('<option value="' + i + '">' + i + ' min</option>');
              }
            </script>
          </select>
          <button onclick="setTimer()">Set/Reset Timer</button>
        </div>

        <h2 id="timerMessage">Make sure notifications are turned on.</h2>

        <img id="play_pause" src="green_play.png" alt="Play/Pause" />
        <audio id="alarmSound" src="Alarm.mp3" preload="auto"></audio>

        <!-- Timer Script -->
        <script src="timer.js"></script>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footerContainer">
      <!-- Social Icons -->
      <div class="socialIcons">
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-google-plus"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
      </div>

      <!-- Navigation Links -->
      <div class="footerNavigation">
        <ul>
          <li><a href="#">Contact Us</a></li>
          <li><a href="#">Site Information</a></li>
          <li><a href="help.html">Need Help?</a></li>
        </ul>
      </div>

      <!-- Credits -->
      <div class="footerBottom">
        <p>Designed by <span class="designer">Ahmad Shalaby and George Shields</span></p>
      </div>
    </div>
  </footer>

</body>
</html>

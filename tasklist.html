<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List - Zen Mode</title>
  <!-- Include Google Fonts, Flatpickr, FullCalendar, and Font Awesome -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Include the same styles as in index.html -->
  <style>
    /* Global Styles */
    #dark-mode {
      width: 67px;
      height: auto;
      cursor: pointer;
    }

    #dark-mode:hover {
      opacity: 0.8;
    }

    body {
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5dc;
    }

    .main {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .content {
      display: flex;
      flex: 1;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    .container, .container2 {
      flex: 1;
      max-width: 550px;
      background-color: #ffffff;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      min-height: 500px;
    }

    h1, h2 {
      text-align: center;
      color: #4b2e2e;
    }

    p {
      text-align: center;
      color: #333;
    }

    /* Task List Styles */
    input#inputText, input#taskDate {
      padding: 10px;
      width: 95%;
      border-radius: 4px;
      border: 1px solid #ddd;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button.addBtn {
      padding: 10px 15px;
      background-color: #4b2e2e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    button.addBtn:hover {
      background-color: #333;
    }

    ul#list {
      list-style-type: none;
      padding: 0;
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
      width: 100%;
    }

    ul#list li {
      background-color: #f9f9f9;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      cursor: move;
    }

    ul#list li:hover {
      background-color: #eef2f5;
    }

    ul#list li button {
      background-color: transparent;
      border: none;
      color: #4b2e2e;
      font-size: 18px;
      cursor: pointer;
    }

    ul#list li button:hover {
      color: #333;
    }

    /* Dark Mode Styles */
    body.dark-mode {
      background-color: #121212;
    }

    .dark-mode .container, .dark-mode .container2 {
      background-color: #1e1e1e;
      color: #ffffff;
      border-color: #333;
    }

    .dark-mode button, .dark-mode input {
      background-color: #333;
      color: #ffffff;
    }

    .dark-mode button.addBtn:hover {
      background-color: black;
    }

    .dark-mode h1, .dark-mode h2 {
      color: #ffffff;
    }

    .dark-mode p {
      color: #eef2f5;
    }

    .dark-mode ul#list li {
      background-color: #333;
      box-shadow: 0 2px 5px rgba(255, 255, 255, 0.1);
    }

    .dark-mode ul#list li:hover {
      background-color: black;
    }

    /* Header Styles */
    .headerContainer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 100px;
      padding: 10px 100px;
      background-color: #fff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .appHeader {
      font-size: 2rem;
      color: #4b2e2e;
      font-weight: bold;
      margin: 0;
    }

    .dark-mode .headerContainer {
      background-color: #1e1e1e;
    }

    .dark-mode .appHeader {
      color: #eef2f5;
    }

    /* Footer Styles */
    footer {
      width: 100%;
      text-align: center;
      padding: 20px 0;
      margin-top: auto;
      transition: background-color 0.3s, color 0.3s;
    }

    body.light-mode footer {
      background-color: #f5f5f5;
      color: #333;
    }

    body.dark-mode footer {
      background-color: #121212;
      color: #eaeaea;
    }

    .footerContainer {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .socialIcons {
      display: flex;
      gap: 15px;
    }

    .socialIcons a {
      text-decoration: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s;
      background-color: #e0e0e0;
      color: #333;
    }

    .socialIcons a i {
      font-size: 1.5rem;
    }

    .footerNavigation ul {
      display: flex;
      gap: 20px;
      list-style: none;
      padding: 0;
    }

    .footerNavigation ul li a {
      text-decoration: none;
      font-size: 1rem;
      color: #4b2e2e;
      transition: color 0.3s;
    }

    .footerBottom {
      font-size: 0.9rem;
      text-align: center;
    }

    /* Priority Styles */
    .task-high {
      border-left: 5px solid #dc3545;
      padding-left: 10px;
      background-color: #ffe6e6;
    }

    .task-medium {
      border-left: 5px solid #ffc107;
      padding-left: 10px;
      background-color: #fff3cd;
    }

    .task-low {
      border-left: 5px solid #28a745;
      padding-left: 10px;
      background-color: #e6ffe6;
    }

    /* Input Group Styles */
    .inputGroup label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #4b2e2e;
    }

    .dark-mode .inputGroup label {
      color: white;
    }

    .required {
      color: #dc3545;
      font-weight: bold;
      margin-left: 5px;
    }

    /* Dropdown Styles */
    #taskPriority {
      background-color: var(--dropdown-bg-color);
      color: var(--dropdown-text-color);
      border: 1px solid var(--dropdown-border-color, #cccccc);
      border-radius: 4px;
      padding: 10px;
      font-size: 16px;
      width: 99%;
      outline: none;
      appearance: none;
      margin-bottom: 10px;
      box-sizing: border-box;
      position: relative;
    }

    #taskPriority::-ms-expand {
      display: none;
    }

    body.light-mode #taskPriority {
      --dropdown-bg-color: #ffffff;
      --dropdown-text-color: #333333;
      --dropdown-border-color: #cccccc;
      --dropdown-hover-bg-color: #f0f0f0;
    }

    body.dark-mode #taskPriority {
      --dropdown-bg-color: #333333;
      --dropdown-text-color: #ffffff;
      --dropdown-border-color: #444444;
      --dropdown-hover-bg-color: #444444;
    }

    #taskPriority:hover {
      background-color: var(--dropdown-hover-bg-color);
      border-color: var(--dropdown-border-color);
    }

    /* Animation */
    @keyframes flash {
      0% { background-color: #e0ffe0; }
      100% { background-color: #f9f9f9; }
    }

    .newTask {
      animation: flash 20s ease-out;
    }

    /* Zen Mode Buttons */
    .zenButtons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }

    /* Breadcrumb */
    .breadcrumb {
      margin: 20px;
      font-size: 1rem;
    }

    .breadcrumb a {
      text-decoration: none;
      color: #4b2e2e;
    }

    .breadcrumb span {
      color: #333;
    }

  </style>
</head>
<body>

  <!-- Header -->
  <div class="headerContainer">
    <header class="appHeader">Productivity App</header>
    <img id="dark-mode" src="dark_mode.png" alt="Dark Mode Button" />
  </div>

  <!-- Dark Mode Toggle Script -->
  <script>
    const darkModeImage = document.getElementById('dark-mode');
    darkModeImage.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>

  <!-- Breadcrumb -->
  <div class="breadcrumb">
    <a href="index.html">Home</a> &gt; <span>Task List</span>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="content">
      <div class="container">
        <h2>Task List - Zen Mode</h2>
        <div class="inputGroup">
          <label for="inputText">Task Name <span class="required">*</span></label>
          <input type="text" id="inputText" placeholder="Enter a task">
          <label for="taskDate">Task Date <span class="required">*</span></label>
          <input type="text" id="taskDate" placeholder="Pick a date for this task">
          <label for="taskPriority">Priority</label>
          <select id="taskPriority">
            <option value="high">High Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="low" selected>Low Priority</option>
          </select>
        </div>
        <button class="addBtn" onclick="newElement()">Add</button>
        <button id="undoBtn" class="addBtn" style="display: none" onclick="undoDelete()">Undo Last Delete</button>
        <ul id="list">
          <!-- Tasks will be added here -->
        </ul>
      </div>
    </div>
  </div>

  <!-- Include Flatpickr and FullCalendar Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>

  <!-- Task List Script -->
  <script>
    flatpickr("#taskDate", {
      dateFormat: "Y-m-d",
      minDate: "today",
      onChange: function (selectedDates, dateStr, instance) {
        displayTasksForDate(dateStr);
      }
    });

    let lastDeletedTask = null;
    let calendar;
    let selectedTask;

    document.addEventListener('DOMContentLoaded', function () {
      initializeCalendar();

      const initialDate = document.getElementById('taskDate').value;
      if (initialDate) {
        displayTasksForDate(initialDate);
      }
    });

    function newElement() {
      const taskTitle = document.getElementById('inputText').value;
      const taskDate = document.getElementById('taskDate').value;
      const taskPriority = document.getElementById('taskPriority').value;

      if (taskTitle && taskDate) {
        const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        tasks.push({ title: taskTitle, start: taskDate, priority: taskPriority });
        localStorage.setItem('tasks', JSON.stringify(tasks));

        addTaskToList(taskTitle, taskDate, taskPriority);

        if (calendar) {
          calendar.refetchEvents();
        }
      } else {
        alert("Please enter both a task and a date.");
      }
    }

    function addTaskToList(title, date, priority) {
      const li = document.createElement("li");
      li.textContent = `${title} - ${date}`;

      if (priority === "high") {
        li.classList.add("task-high");
      } else if (priority === "medium") {
        li.classList.add("task-medium");
      } else {
        li.classList.add("task-low");
      }

      li.classList.add("newTask");
      setTimeout(() => {
        li.classList.remove("newTask");
      }, 500);

      document.getElementById("list").appendChild(li);

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "✖";
      deleteBtn.onclick = function () {
        lastDeletedTask = { title, date, priority, element: li };
        li.remove();
        removeTaskFromCalendar(title, date);
        removeTaskFromLocalStorage(title, date);
        showUndoButton();
      };
      li.appendChild(deleteBtn);
    }

    function showUndoButton() {
      const undoBtn = document.getElementById("undoBtn");
      undoBtn.style.display = "inline";
      setTimeout(() => {
        undoBtn.style.display = "none";
        lastDeletedTask = null;
      }, 5000);
    }

    function undoDelete() {
      if (lastDeletedTask) {
        const { title, date, priority, element } = lastDeletedTask;

        document.getElementById("list").appendChild(element);

        addTaskToCalendar(title, date, priority);

        const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        tasks.push({ title, start: date, priority: priority });
        localStorage.setItem('tasks', JSON.stringify(tasks));

        document.getElementById("undoBtn").style.display = "none";
        lastDeletedTask = null;
      }
    }

    function addTaskToCalendar(title, date, priority) {
      if (calendar) {
        calendar.addEvent({
          title: title,
          start: date,
          allDay: true,
          extendedProps: { priority: priority }
        });
      }
    }

    function removeTaskFromCalendar(taskTitle, taskDate) {
      if (calendar) {
        const events = calendar.getEvents();
        events.forEach(event => {
          if (event.title === taskTitle && event.startStr === taskDate) {
            event.remove();
          }
        });
      }
    }

    function removeTaskFromLocalStorage(taskTitle, taskDate) {
      const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      const updatedTasks = tasks.filter(task => !(task.title === taskTitle && task.start === taskDate));
      localStorage.setItem('tasks', JSON.stringify(updatedTasks));
    }

    function displayTasksForDate(date) {
      const listEl = document.getElementById('list');
      listEl.innerHTML = '';

      const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      const filteredTasks = tasks.filter(task => task.start === date);

      filteredTasks.forEach(task => addTaskToList(task.title, task.start, task.priority));
    }

    function initializeCalendar() {
      const calendarEl = document.getElementById('calendar');
      if (calendarEl) {
        calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          events: function(fetchInfo, successCallback, failureCallback) {
            const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            successCallback(tasks);
          },
          eventContent: function(info) {
            let eventEl = document.createElement('div');
            eventEl.style.display = 'flex';
            eventEl.style.alignItems = 'center';
            eventEl.style.gap = '5px';

            let priorityIndicator = document.createElement('span');
            priorityIndicator.style.display = 'inline-block';
            priorityIndicator.style.width = '10px';
            priorityIndicator.style.height = '10px';
            priorityIndicator.style.borderRadius = '50%';

            if (info.event.extendedProps.priority === 'high') {
              priorityIndicator.style.backgroundColor = '#dc3545';
            } else if (info.event.extendedProps.priority === 'medium') {
              priorityIndicator.style.backgroundColor = '#ffc107';
            } else if (info.event.extendedProps.priority === 'low') {
              priorityIndicator.style.backgroundColor = '#28a745';
            }

            let titleEl = document.createElement('span');
            titleEl.innerText = info.event.title;
            titleEl.style.color = 'inherit';

            eventEl.appendChild(priorityIndicator);
            eventEl.appendChild(titleEl);

            return { domNodes: [eventEl] };
          },
        });

        calendar.render();
      }
    }
  </script>

  <!-- Footer -->
  <footer>
    <div class="footerContainer">
      <!-- Social Icons -->
      <div class="socialIcons">
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-google-plus"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
      </div>

      <!-- Navigation Links -->
      <div class="footerNavigation">
        <ul>
          <li><a href="#">Contact Us</a></li>
          <li><a href="#">Site Information</a></li>
          <li><a href="help.html">Need Help?</a></li>
        </ul>
      </div>

      <!-- Credits -->
      <div class="footerBottom">
        <p>Designed by <span class="designer">Ahmad Shalaby and George Shields</span></p>
      </div>
    </div>
  </footer>

</body>
</html>
